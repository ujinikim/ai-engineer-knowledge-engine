name: Backend image

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ai-engineer-knowledge-engine-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d knowledge_engine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run backend tests
        env:
          APP_ENVIRONMENT: test
        run: uv run --project backend pytest backend/tests

      - name: Verify database migration lifecycle
        env:
          APP_ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/knowledge_engine
        run: |
          uv run --project backend alembic -c backend/alembic.ini upgrade head
          uv run --project backend alembic -c backend/alembic.ini check

          # Simulate adopting an unversioned database created by the former SQL
          # bootstrap, whose schema is the baseline revision.
          uv run --project backend alembic -c backend/alembic.ini downgrade base
          uv run --project backend alembic -c backend/alembic.ini upgrade 20260802_0001
          uv run --project backend python backend/scripts/verification/verify_migration_adoption.py seed
          uv run --project backend alembic -c backend/alembic.ini stamp base
          uv run --project backend alembic -c backend/alembic.ini upgrade head
          uv run --project backend python backend/scripts/verification/verify_migration_adoption.py verify

          # Prove that the baseline can be rebuilt from zero.
          uv run --project backend alembic -c backend/alembic.ini downgrade base
          uv run --project backend alembic -c backend/alembic.ini upgrade head
          uv run --project backend alembic -c backend/alembic.ini current --check-heads
          uv run --project backend python backend/scripts/verification/verify_health_endpoints.py
          uv run --project backend python backend/scripts/verification/verify_collector_lock.py

      - name: Verify the production image builds
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "backend:${GITHUB_SHA}" \
            backend

      - name: Verify production configuration gate
        run: |
          if [[ "$(docker run --rm --entrypoint id "backend:${GITHUB_SHA}" -u)" != "10001" ]]; then
            echo "The production container is not using the fixed unprivileged runtime UID."
            exit 1
          fi

          if docker run --rm "backend:${GITHUB_SHA}" \
            python -c "from app.main import app" >/tmp/unsafe-production-start.log 2>&1; then
            echo "The production image accepted missing required configuration."
            exit 1
          fi

          docker run --rm \
            --env OPENAI_API_KEY=ci-validation-key \
            --env DATABASE_URL=postgresql+psycopg://app:secret@database.internal:5432/knowledge_engine \
            --env 'CORS_ORIGINS=["https://example.cloudfront.net"]' \
            "backend:${GITHUB_SHA}" \
            python -c "from app.main import app; print(app.title)"

      - name: Verify packaged structured log safety
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(docker run --rm --detach \
            --publish 127.0.0.1:18080:8000 \
            --env OPENAI_API_KEY=ci-validation-key \
            --env DATABASE_URL=postgresql+psycopg://app:secret@database.internal:5432/knowledge_engine \
            --env 'CORS_ORIGINS=["https://example.cloudfront.net"]' \
            "backend:${GITHUB_SHA}")"
          cleanup() {
            docker stop "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null; then
              break
            fi
            if [[ "${attempt}" == "20" ]]; then
              echo "The packaged API did not become live."
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent \
            --header 'Authorization: Bearer packaged-header-secret' \
            --header 'X-Request-ID: packaged-ci-check' \
            'http://127.0.0.1:18080/health?api_key=sk-packaged-query-secret123' \
            >/dev/null

          container_logs="$(docker logs "${container_id}" 2>&1)"
          if ! grep -F '"event":"api_request_completed"' <<<"${container_logs}" >/dev/null; then
            echo "The packaged API did not emit its structured request event."
            exit 1
          fi
          if ! grep -F '"request_id":"packaged-ci-check"' <<<"${container_logs}" >/dev/null; then
            echo "The structured request event omitted its request ID."
            exit 1
          fi
          if grep -E 'packaged-header-secret|packaged-query-secret123' \
            <<<"${container_logs}" >/dev/null; then
            echo "Sensitive request data appeared in packaged API logs."
            exit 1
          fi
          if grep -F '"path":"/health/live"' <<<"${container_logs}" >/dev/null; then
            echo "Successful liveness probes should not emit application request logs."
            exit 1
          fi

  publish:
    name: Publish and scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Exchange GitHub OIDC token for AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-image-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Build and publish immutable image
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${registry}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "The immutable image already exists; keeping and verifying it."
          else
            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${registry}"

            docker build \
              --platform linux/amd64 \
              --build-arg "VCS_REF=${GITHUB_SHA}" \
              --tag "${image_uri}" \
              backend

            # Alpine's libuuid package is built from the util-linux source
            # package, so ECR can attribute mount/nsenter CVEs to it even when
            # those util-linux programs are absent. Prove the reviewed image has
            # libuuid only, not util-linux, before publishing it.
            docker run --rm --entrypoint sh "${image_uri}" -ec '
              apk info -e libuuid >/dev/null
              ! apk info -e util-linux >/dev/null 2>&1
              nsenter_path="$(readlink -f "$(command -v nsenter)")"
              apk info -W "${nsenter_path}" | grep -q "owned by busybox-"
            '

            docker push "${image_uri}"
          fi

          digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          echo "image_uri=${image_uri}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Require a clean ECR scan
        shell: bash
        run: |
          set -euo pipefail

          scan_status=""
          for attempt in $(seq 1 30); do
            scan_status="$(aws ecr describe-image-scan-findings \
              --repository-name "${ECR_REPOSITORY}" \
              --image-id "imageTag=${IMAGE_TAG}" \
              --query 'imageScanStatus.status' \
              --output text 2>/dev/null || true)"

            if [[ "${scan_status}" == "COMPLETE" ]]; then
              break
            fi

            case "${scan_status}" in
              FAILED|UNSUPPORTED_IMAGE|FINDINGS_UNAVAILABLE|LIMIT_EXCEEDED|SCAN_ELIGIBILITY_EXPIRED)
                echo "ECR scan ended with status ${scan_status}."
                exit 1
                ;;
            esac

            echo "Waiting for ECR scan (${attempt}/30); status: ${scan_status:-pending}"
            sleep 5
          done

          if [[ "${scan_status}" != "COMPLETE" ]]; then
            echo "ECR scan did not complete within 150 seconds."
            exit 1
          fi

          findings="$(aws ecr describe-image-scan-findings \
            --repository-name "${ECR_REPOSITORY}" \
            --image-id "imageTag=${IMAGE_TAG}" \
            --output json)"

          approved_util_linux_cves='[
            "CVE-2026-27456",
            "CVE-2026-76642",
            "CVE-2026-78408",
            "CVE-2026-78409",
            "CVE-2026-78410"
          ]'
          reviewed_exceptions="$(jq \
            --argjson approved "${approved_util_linux_cves}" '
              def attr($key):
                ((.attributes // [])
                  | map(select((.key | ascii_downcase) == $key))
                  | first
                  | .value) // "";
              [
                .imageScanFindings.findings[]?
                | select(.severity == "HIGH" or .severity == "CRITICAL")
                | select(.name as $cve | $approved | index($cve))
                | select(
                    (attr("package_name") == "util-linux"
                      or attr("package_name") == "libuuid")
                    and attr("package_version") == "2.42.1-r0"
                  )
              ]
            ' <<<"${findings}")"
          blocking_findings="$(jq \
            --argjson approved "${approved_util_linux_cves}" '
              def attr($key):
                ((.attributes // [])
                  | map(select((.key | ascii_downcase) == $key))
                  | first
                  | .value) // "";
              [
                .imageScanFindings.findings[]?
                | select(.severity == "HIGH" or .severity == "CRITICAL")
                | select(
                    ((.name as $cve | $approved | index($cve)) != null
                      and (attr("package_name") == "util-linux"
                        or attr("package_name") == "libuuid")
                      and attr("package_version") == "2.42.1-r0")
                    | not
                  )
              ]
            ' <<<"${findings}")"

          critical="$(jq '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' \
            <<<"${findings}")"
          high="$(jq '.imageScanFindings.findingSeverityCounts.HIGH // 0' \
            <<<"${findings}")"
          medium="$(jq '.imageScanFindings.findingSeverityCounts.MEDIUM // 0' \
            <<<"${findings}")"
          exception_count="$(jq 'length' <<<"${reviewed_exceptions}")"
          blocking_count="$(jq 'length' <<<"${blocking_findings}")"

          {
            echo "### Backend container image"
            echo ""
            echo "- Image: \`${{ steps.publish.outputs.image_uri }}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
            echo "- ECR scan: ${critical} critical, ${high} high, ${medium} medium"
            echo "- Reviewed libuuid exceptions: ${exception_count}"
            echo "- Blocking critical/high findings: ${blocking_count}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if (( blocking_count > 0 )); then
            echo "The image has unapproved critical or high ECR findings:"
            jq -r '.[] | "- \(.name): \(.severity)"' <<<"${blocking_findings}"
            exit 1
          fi
