name: AWS OIDC smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  identity:
    name: Verify temporary AWS identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange GitHub OIDC token for AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-oidc-smoke-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify assumed role
        run: aws sts get-caller-identity --query Arn --output text
