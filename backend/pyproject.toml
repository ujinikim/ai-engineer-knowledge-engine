[project]
name = "ai-engineer-knowledge-engine-backend"
version = "0.1.0"
description = "FastAPI backend for an AI engineering documentation RAG engine"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "beautifulsoup4>=4.12.0",
  "fastapi[standard]>=0.115.0",
  "feedparser>=6.0.11",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "pgvector>=0.3.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.5.0",
  "pyyaml>=6.0.0",
  "sqlalchemy>=2.0.0",
  "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
